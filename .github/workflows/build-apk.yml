name: Build and Publish Apps

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android SDK tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TOC-Empty-Stack-Acceptor.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TOC-Empty-Stack-Acceptor-APK
          path: TOC-Empty-Stack-Acceptor.apk

  windows:
    name: Build Windows Desktop Installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install dependencies
        run: npm install

      - name: Configure Windows code signing
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$CSC_KEY_PASSWORD" ]; then
            echo "Windows code-signing certificate configured."
            echo "CSC_LINK=$CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No Windows code-signing certificate configured; building unsigned installer."
          fi

      - name: Build Windows installer
        run: npm run dist

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: TOC-Empty-Stack-Acceptor-Windows
          path: desktop/dist/*.exe

  publish:
    name: Publish Latest Downloads
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: TOC-Empty-Stack-Acceptor-APK
          path: release

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: TOC-Empty-Stack-Acceptor-Windows
          path: release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TOC Empty Stack Acceptor - Latest
          body: |
            Latest downloads for the TOC Empty Stack Acceptor.

            - Android: TOC-Empty-Stack-Acceptor.apk
            - Windows: TOC-Empty-Stack-Acceptor-Setup.exe

            The Windows installer creates a desktop shortcut automatically.
          make_latest: true
          overwrite_files: true
          files: |
            release/TOC-Empty-Stack-Acceptor.apk
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
